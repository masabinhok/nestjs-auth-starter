<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="460" viewBox="0 0 1500 460" role="img" aria-labelledby="title desc">
  <title id="title">NestJS Auth Starter</title>
  <desc id="desc">Production starter for the official NestJS authentication and authorization packages.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1222"/>
      <stop offset="1" stop-color="#2a1022"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4d6d"/>
      <stop offset="1" stop-color="#e0234e"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>
  <rect width="1500" height="460" fill="url(#bg)"/>
  <rect width="1500" height="460" fill="url(#grid)"/>

  <!-- Shield with keyhole -->
  <g transform="translate(150 105)">
    <path d="M110 0 L220 40 V130 C220 200 170 240 110 260 C50 240 0 200 0 130 V40 Z" fill="url(#accent)"/>
    <path d="M110 18 L202 52 V130 C202 189 160 223 110 240 C60 223 18 189 18 130 V52 Z" fill="#0f1222" fill-opacity="0.25"/>
    <circle cx="110" cy="115" r="30" fill="#ffffff"/>
    <path d="M96 130 H124 L118 185 H102 Z" fill="#ffffff"/>
  </g>

  <g font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" fill="#ffffff">
    <text x="440" y="190" font-size="76" font-weight="800" letter-spacing="-1">NestJS Auth Starter</text>
    <text x="442" y="245" font-size="26" fill="#c9cde0">Production starter for <tspan fill="#ff7a93" font-weight="600">@nestjs/authentication</tspan> + <tspan fill="#ff7a93" font-weight="600">@nestjs/authorization</tspan></text>
    <text x="442" y="310" font-size="24" fill="#ffffff" fill-opacity="0.9">Sessions · Tokens · 2FA · Passkeys · Magic links · Google &amp; GitHub · API keys · Policies</text>
    <text x="442" y="360" font-size="22" fill="#8f95b2">NestJS 12 · Prisma 7 · PostgreSQL · Docker · 100+ tests</text>
  </g>
</svg>
